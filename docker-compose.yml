services:
  # PostgreSQL with pgvector extension
  postgres:
    image: ankane/pgvector:pg16
    container_name: openinsights-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: openinsights
      POSTGRES_PASSWORD: openinsights_dev
      POSTGRES_DB: openinsights
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U openinsights -d openinsights']
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for BullMQ job queues
  redis:
    image: redis:7-alpine
    container_name: openinsights-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO for S3-compatible local storage
  minio:
    image: minio/minio:latest
    container_name: openinsights-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: openinsights
      MINIO_ROOT_PASSWORD: openinsights_dev
    ports:
      - '9000:9000' # API
      - '9001:9001' # Console
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5

  # Worker service with FFmpeg for processing
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: openinsights-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://openinsights:openinsights_dev@postgres:5432/openinsights
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: openinsights
      S3_SECRET_KEY: openinsights_dev
      S3_BUCKET: openinsights
      S3_REGION: us-east-1
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    profiles:
      - worker

volumes:
  postgres_data:
  redis_data:
  minio_data:
